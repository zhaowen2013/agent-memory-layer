[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-memory"
version = "0.1.0"
description = "Pluggable local memory layer for AI agents: swappable embeddings, vector stores, and summarizers. Runs offline with zero dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "agent-memory contributors" }]
keywords = ["agent", "memory", "llm", "rag", "vector-store", "local-first"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
# semantic embeddings (downloads a small model, runs locally)
hf = ["sentence-transformers"]
# OpenAI / OpenAI-compatible API embeddings & summarization
openai = ["openai"]
# persistent local vector DB with real ANN indexing
chroma = ["chromadb"]
dev = ["pytest"]

[project.scripts]
agent-memory = "agent_memory.cli:main"

[tool.setuptools.packages.find]
include = ["agent_memory*"]
